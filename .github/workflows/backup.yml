name: Daily Turso Backup

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:      # manual trigger

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Turso CLI
        run: curl -sSfL https://get.tur.so/install.sh | bash

      - name: Authenticate Turso
        run: turso auth token --expire 300
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Run backup
        run: ./scripts/backup-db.sh /tmp/backups
        env:
          TURSO_DATABASE_NAME: ifesquare
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: turso-backup-${{ github.run_id }}
          path: /tmp/backups/ifesquare-*.sql.gz
          retention-days: 30
